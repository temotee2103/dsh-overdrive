<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- 窗口 -->
  <rect x="20" y="20" width="640" height="480" rx="18" fill="url(#bg)" stroke="#232a38" stroke-width="1.5"/>
  <rect x="20" y="20" width="640" height="46" rx="18" fill="#1a1f2b"/>
  <rect x="20" y="48" width="640" height="18" fill="#1a1f2b"/>
  <circle cx="48" cy="43" r="6" fill="#ff5f57"/><circle cx="68" cy="43" r="6" fill="#febc2e"/><circle cx="88" cy="43" r="6" fill="#28c840"/>
  <text x="340" y="48" fill="#8b94a7" font-size="13" text-anchor="middle" font-weight="600">dsh-overdrive · Telegram</text>
  <text x="420" y="24" fill="#4ade80" font-size="11">● live</text>

  <!-- 用户消息（1.6s 出现） -->
  <g transform="translate(0,10)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.114;0.14;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0" keyTimes="0;0.114;0.14;1" dur="14s" repeatCount="indefinite"/>
    <rect x="300" y="84" width="330" height="40" rx="14" fill="url(#accent)"/>
    <text x="316" y="102" fill="#fff" font-size="14">帮我看看这个项目有多少个包</text>
    <text x="316" y="118" fill="#cdd6ff" font-size="10">You · 10:02</text>
  </g>

  <!-- 打字中（1.4s） -->
  <g transform="translate(0,10)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.12;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0" keyTimes="0;0.1;0.12;1" dur="14s" repeatCount="indefinite"/>
    <rect x="40" y="140" width="64" height="34" rx="14" fill="#232a38"/>
    <circle cx="58" cy="157" r="4" fill="#8b94a7">
      <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.3;1" dur="1.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="74" cy="157" r="4" fill="#8b94a7">
      <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.3;1" dur="1.2s" begin="1.55s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="157" r="4" fill="#8b94a7">
      <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.3;1" dur="1.2s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 轨迹卡片（2.4s） -->
  <g transform="translate(0,10)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.171;0.19;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0" keyTimes="0;0.171;0.19;1" dur="14s" repeatCount="indefinite"/>
    <rect x="40" y="192" width="330" height="132" rx="14" fill="#232a38" stroke="#2e3748" stroke-width="1"/>
    <text x="58" y="214" fill="#ffd166" font-size="12" font-weight="700">📋 轨迹（2 步）</text>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.22;1" dur="14s" repeatCount="indefinite"/>
      <rect x="58" y="226" width="294" height="26" rx="8" fill="#1c2230"/><text x="70" y="243" fill="#e6e6e6" font-size="12">🧠 分析消息</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.229;0.25;1" dur="14s" repeatCount="indefinite"/>
      <rect x="58" y="258" width="294" height="26" rx="8" fill="#1c2230"/><text x="70" y="275" fill="#e6e6e6" font-size="12">🛠️ mock.tool: echo</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.257;0.28;1" dur="14s" repeatCount="indefinite"/>
      <rect x="58" y="290" width="294" height="26" rx="8" fill="#14271c"/><text x="70" y="307" fill="#4ade80" font-size="12">✅ Mock agent received: 帮我看看这个项目有多少个包</text>
    </g>
  </g>

  <!-- 回复（4.6s） -->
  <g transform="translate(0,10)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.329;0.35;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0" keyTimes="0;0.329;0.35;1" dur="14s" repeatCount="indefinite"/>
    <rect x="40" y="340" width="520" height="36" rx="14" fill="#232a38"/>
    <text x="58" y="362" fill="#e6e6e6" font-size="14">共 4 个包：sdk · gateway · gateway-core · mock-dsh</text>
  </g>

  <!-- 审批（6.0s） -->
  <g transform="translate(0,10)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.429;0.45;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0" keyTimes="0;0.429;0.45;1" dur="14s" repeatCount="indefinite"/>
    <rect x="40" y="396" width="560" height="44" rx="14" fill="#3a1d1d" stroke="#6b2e2e" stroke-width="1"/>
    <text x="58" y="424" fill="#fca5a5" font-size="13">⚠️ 需要批准：执行危险操作（120s 内有效）</text>
  </g>

  <!-- 按钮（6.6s / 6.8s） -->
  <g transform="translate(0,10)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.471;0.5;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0" keyTimes="0;0.471;0.5;1" dur="14s" repeatCount="indefinite"/>
    <rect x="340" y="452" width="120" height="32" rx="16" fill="#1f8b4c"/>
    <text x="400" y="473" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">✅ 同意</text>
  </g>
  <g transform="translate(0,10)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.486;0.52;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0" keyTimes="0;0.486;0.52;1" dur="14s" repeatCount="indefinite"/>
    <rect x="474" y="452" width="120" height="32" rx="16" fill="#2a3040"/>
    <text x="534" y="473" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">🚫 拒绝</text>
  </g>
</svg>
